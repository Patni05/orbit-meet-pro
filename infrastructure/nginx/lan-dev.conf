# Single-origin HTTPS front for testing on real devices.
#
# Phones will not grant camera or microphone access over plain HTTP: outside
# localhost, getUserMedia requires a secure context. Serving the app, the API,
# the realtime socket and the SFU signalling through one TLS origin means the
# device has exactly one certificate to accept, instead of one per port.
#
# Media itself does not pass through here. WebRTC sends it directly over UDP to
# the SFU (already encrypted with DTLS-SRTP), which is why LIVEKIT_NODE_IP must
# be set to the machine's LAN address.
#
# Development only — the certificate is self-signed. See orbit.conf for the
# production shape.

# WebSocket upgrades: only send "Connection: upgrade" when the client asked for
# one, otherwise let the connection be kept alive normally.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve the scheme the *browser* used.
#
# Cloudflare Tunnel terminates TLS at the edge and forwards to this server over
# plain HTTP, setting X-Forwarded-Proto: https. Overwriting that with $scheme
# would tell the API the client is on HTTP, and it would hand back a ws:// SFU
# address that an HTTPS page then refuses to load as mixed content.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream orbit_web {
    # The dev servers run on the host, not inside Docker.
    server host.docker.internal:3000;
}

upstream orbit_api {
    server host.docker.internal:4000;
}

upstream orbit_livekit {
    server livekit:7880;
}

server {
    listen 8443 ssl;
    http2 on;

    # Plain HTTP for Cloudflare Tunnel, which terminates TLS at the edge and
    # connects to the origin locally. The ssl_* directives below apply only to
    # the 8443 listener.
    listen 8080;

    server_name _;

    ssl_certificate     /etc/nginx/certs/orbit-lan.crt;
    ssl_certificate_key /etc/nginx/certs/orbit-lan.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # WebRTC offers can be large; the default 1m is tight for big SDPs.
    client_max_body_size 10m;

    # Long-lived upgrades must not be culled mid-meeting.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # ---- REST API --------------------------------------------------------
    # The /api prefix is stripped by the trailing slash on proxy_pass, so the
    # API keeps serving /auth and /meetings at their own paths and needs no
    # base-path awareness.
    location /api/ {
        proxy_pass http://orbit_api/;

        # The refresh cookie is deliberately scoped to /auth so it is only ever
        # sent to the endpoints that need it. Stripping the /api prefix above
        # means the browser sees those endpoints at /api/auth, so the cookie
        # path has to be rewritten to match — otherwise the cookie is set and
        # then never sent back, and every session silently fails to refresh.
        proxy_cookie_path /auth /api/auth;
    }

    # ---- realtime socket -------------------------------------------------
    # Socket.IO is configured with path '/realtime'; the namespace (/rt) rides
    # in the query string, so this single location covers it.
    location /realtime {
        proxy_pass http://orbit_api;
    }

    # ---- SFU signalling --------------------------------------------------
    # livekit-client appends /rtc to the URL it is given, so a client pointed
    # at wss://host:8443/livekit lands on the SFU's /rtc endpoint.
    location /livekit/ {
        proxy_pass http://orbit_livekit/;
    }

    # ---- the app ---------------------------------------------------------
    # Everything else, including Next.js hot reload over WebSocket.
    location / {
        proxy_pass http://orbit_web;
    }
}
