# Coturn — TURN relay for participants behind restrictive NAT or firewalls.
#
# Most WebRTC connections succeed over STUN alone. TURN is the fallback that
# makes the remaining ~10-15% work: corporate networks, symmetric NAT, and
# mobile carriers that block UDP.

listening-port=3478
tls-listening-port=5349

# The relay range that must be open in the firewall (UDP).
min-port=49160
max-port=49200

fingerprint
lt-cred-mech

# realm, user and external-ip are supplied on the command line from .env so no
# credentials live in this file.

# Security hardening: never relay to private ranges, which would turn the TURN
# server into a proxy into the internal network.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Uncomment for TURN over TLS (turns:) once certificates are in place.
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

no-cli
simple-log
verbose
