# ---------------------------------------------------------------------------
# Orbit — local development stack
#
#   docker compose up -d postgres redis livekit        # the usual set
#   docker compose --profile turn up -d coturn         # add TURN
#   docker compose --profile recording up -d egress    # add recording
#   docker compose --profile app up -d api web         # run the apps in Docker too
#
# Everything here is self-hostable and open source. No proprietary services.
# ---------------------------------------------------------------------------

name: orbit

services:
  postgres:
    image: postgres:16-alpine
    container_name: orbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
    ports:
      # Bound to loopback: the database is never reachable from the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-orbit} -d ${POSTGRES_DB:-orbit}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: orbit-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.9
    container_name: orbit-livekit
    restart: unless-stopped
    # --node-ip is what the browser will try to reach for media. 127.0.0.1 works
    # for tabs on this machine; set LIVEKIT_NODE_IP to your LAN IP to test from
    # a phone or a second computer.
    environment:
      # Real credentials come from .env so they never enter the repo; this
      # overrides the placeholder key in livekit.yaml.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    command: >
      --config /etc/livekit.yaml
      --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - '7880:7880'          # signalling (HTTP/WebSocket)
      - '7881:7881'          # WebRTC over TCP (fallback)
      - '7882:7882/udp'      # WebRTC over UDP, single-port mux
    volumes:
      - ./infrastructure/livekit/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:7880/']
      interval: 15s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: orbit-coturn
    restart: unless-stopped
    profiles: ['turn']
    network_mode: host
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --user=${TURN_USERNAME:-orbit}:${TURN_PASSWORD:-orbit_dev_turn_password}
      - --realm=${TURN_REALM:-orbit.local}
    volumes:
      - ./infrastructure/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

  # Server-side recording. Requires Redis, and talks to LiveKit over it.
  egress:
    image: livekit/egress:latest
    container_name: orbit-egress
    restart: unless-stopped
    profiles: ['recording']
    environment:
      # Credentials come from .env, exactly as they do for the livekit service.
      #
      # The config cannot be a mounted file here: egress does no substitution
      # inside the YAML, so a file would have to contain the real key and
      # secret — which is both a secret in the repo and, when the key is
      # rotated in .env and not in the file, an egress that authenticates as
      # nobody. It fails with "invalid API key", the recording never starts,
      # and the meeting simply never produces a file. Passing the body through
      # the environment keeps one source of truth.
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        file_output:
          local: true
        log_level: info
        health_port: 9090
        cpu_cost:
          room_composite_cpu_cost: 2
    volumes:
      - ./recordings:/recordings
    # Chromium inside egress needs a larger shared memory segment.
    shm_size: 1gb
    depends_on:
      redis:
        condition: service_healthy

  # ---- the applications themselves (optional; `npm run dev` is nicer day to day)

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: orbit-api
    restart: unless-stopped
    profiles: ['app']
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-orbit}:${POSTGRES_PASSWORD:-orbit_dev_password}@postgres:5432/${POSTGRES_DB:-orbit}?schema=public
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: http://livekit:7880
      HOST: 0.0.0.0
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: orbit-web
    restart: unless-stopped
    profiles: ['app']
    ports:
      - '3000:3000'
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: orbit-nginx
    restart: unless-stopped
    profiles: ['proxy']
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infrastructure/nginx/orbit.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web

  # Single HTTPS origin for testing on a phone or a second machine.
  # Started by: npm run lan  (see scripts/lan.mjs)
  proxy-lan:
    image: nginx:1.27-alpine
    container_name: orbit-proxy-lan
    restart: unless-stopped
    profiles: ['lan']
    ports:
      - '8443:8443'
      # Plain HTTP for Cloudflare Tunnel (TLS is terminated at the edge).
      - '8080:8080'
    volumes:
      - ./infrastructure/nginx/lan-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    extra_hosts:
      # Lets the container reach the dev servers running on the host.
      - 'host.docker.internal:host-gateway'
    depends_on:
      - livekit

volumes:
  postgres-data:
  redis-data:
